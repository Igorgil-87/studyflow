[pytest]
# Os arquivos "_algo_test.py" na raiz do projeto NÃO são testes pytest de
# verdade — são scripts de verificação manual (têm assert solto que roda
# na hora do import, dependem de estado acumulado tipo contador de
# observabilidade). Continuam funcionando do jeito de sempre, rodando
# direto: python3 _nome_test.py
#
# O pytest, a partir de agora, só olha pra pasta tests/ — onde ficam os
# testes automatizados de verdade (função test_*, isolados, sem
# depender de estado de sessões anteriores).
testpaths = tests
python_files = test_*.py
