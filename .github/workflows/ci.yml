name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Instalar dependências
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt --break-system-packages
          pip install pytest ruff --break-system-packages

      - name: "[DIAGNÓSTICO TEMPORÁRIO] Investigar o langchain_core"
        run: |
          echo "== python resolve langchain_core pra onde (import direto) =="
          python3 -c "import langchain_core; print('arquivo:', langchain_core.__file__); print('path:', langchain_core.__path__)" || echo "IMPORT DIRETO FALHOU"
          echo
          echo "== onde existem copias de langchain_core no sistema (sem travar em erro de permissao) =="
          find / -maxdepth 6 -iname "langchain_core*" -not -path "*/node_modules/*" 2>/dev/null || true
          echo
          echo "== sys.path completo (python -c simples) =="
          python3 -c "import sys; [print(p) for p in sys.path]"
          echo
          echo "== TESTE DECISIVO: reproduz exatamente como o pytest importa, isolado, so o 1o arquivo que falha =="
          python3 -m pytest tests/test_curriculum_agent.py -v --collect-only 2>&1 || echo "FALHOU EM COLLECT-ONLY ISOLADO (rootdir=/home/runner/.../studyflow)"
          echo
          echo "== sys.path DE DENTRO do pytest (via conftest inline) =="
          python3 -m pytest tests/test_curriculum_agent.py --collect-only -q -p no:cacheprovider --co 2>&1 | head -30 || true
          echo
          echo "== o pytest.ini tem alguma config de rootdir/testpaths que mude o sys.path? =="
          cat pytest.ini 2>/dev/null || echo "sem pytest.ini"
          echo
          echo "== existe conftest.py na raiz ou em tests/, e o que ele faz? =="
          find . -maxdepth 2 -iname "conftest.py" -exec echo "--- {} ---" \; -exec cat {} \;

      - name: Lint (ruff) — não bloqueia ainda, só avisa
        continue-on-error: true
        run: ruff check .

      - name: Rodar suíte de testes
        run: python3 -m pytest tests/ -v

      - name: Auditoria de segredos expostos
        run: bash scripts/security_check.sh
