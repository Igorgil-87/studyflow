<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyFlow · Entrar</title>
  <style>
    :root{
      --bg:#050507; --card:rgba(18,19,24,0.62); --line:rgba(255,255,255,0.10);
      --accent:#d4ff4f; --text:#f4f3f0; --muted:#9b9a96; --input:rgba(255,255,255,0.06);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh; background:var(--bg); color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
      display:flex; align-items:center; justify-content:center; overflow:hidden;}
    #bgvideo{position:fixed; inset:0; width:100%; height:100%; object-fit:cover;
      z-index:-2; filter:brightness(0.45) saturate(1.1);}
    .bg-fallback{position:fixed; inset:0; z-index:-3;
      background:radial-gradient(1200px 600px at 70% 20%, rgba(50,90,120,0.35), transparent 60%),
        radial-gradient(900px 500px at 20% 80%, rgba(120,90,180,0.25), transparent 60%), #050507;}
    .overlay{position:fixed; inset:0; z-index:-1;
      background:radial-gradient(circle at 50% 40%, rgba(5,5,7,0.25), rgba(5,5,7,0.88));}
    .grid-lines{position:fixed; inset:0; z-index:-1; opacity:0.06;
      background-image:linear-gradient(var(--accent) 1px,transparent 1px),
                       linear-gradient(90deg,var(--accent) 1px,transparent 1px);
      background-size:48px 48px;
      -webkit-mask-image:radial-gradient(circle at 50% 45%, black, transparent 70%);
      mask-image:radial-gradient(circle at 50% 45%, black, transparent 70%);}
    .card{width:min(92vw,430px); padding:38px 34px;
      background:var(--card); border:1px solid var(--line); border-radius:24px;
      backdrop-filter:blur(24px) saturate(1.2); -webkit-backdrop-filter:blur(24px) saturate(1.2);
      box-shadow:0 30px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
      animation:rise .6s cubic-bezier(.2,.8,.2,1);}
    @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
    .brand{display:flex;align-items:center;gap:12px;justify-content:center;margin-bottom:6px}
    .brand-logo{width:40px;height:40px;border-radius:11px;background:var(--accent);
      display:flex;align-items:center;justify-content:center}
    .brand-logo svg{width:22px;height:22px}
    .brand-name{font-size:22px;font-weight:700;letter-spacing:-.5px}
    .brand-name span{color:var(--accent)}
    .subtitle{text-align:center;color:var(--muted);font-size:13.5px;margin:10px 0 24px}
    .social{display:flex;flex-direction:column;gap:10px;margin-bottom:18px}
    .social a{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;
      border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,0.04);
      color:var(--text);text-decoration:none;font-size:14px;font-weight:600;
      transition:background .15s ease,transform .15s ease;}
    .social a:hover{background:rgba(255,255,255,0.10);transform:translateY(-1px)}
    .social svg{width:18px;height:18px}
    .divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px;margin:16px 0}
    .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--line)}
    .field{margin-bottom:14px}
    .field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;
      font-weight:500;letter-spacing:.2px}
    .field input{width:100%;padding:13px 15px;border-radius:12px;background:var(--input);
      border:1px solid var(--line);color:var(--text);font-size:14.5px;outline:none;
      transition:border .15s ease,background .15s ease;}
    .field input::placeholder{color:rgba(155,154,150,0.7)}
    .field input:focus{border-color:var(--accent);background:rgba(255,255,255,0.09)}
    /* corrige o autofill do navegador (que deixava o campo branco) */
    input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus{
      -webkit-text-fill-color:var(--text);
      -webkit-box-shadow:0 0 0 1000px rgba(26,27,33,0.95) inset;
      caret-color:var(--text); transition:background-color 9999s ease;}
    .btn-primary{width:100%;padding:14px;margin-top:4px;border:none;border-radius:12px;
      background:var(--accent);color:#06080a;font-size:15px;font-weight:700;cursor:pointer;
      transition:filter .15s ease,transform .15s ease;}
    .btn-primary:hover{filter:brightness(1.05);transform:translateY(-1px)}
    .toggle{text-align:center;margin-top:18px;color:var(--muted);font-size:13px}
    .toggle a{color:var(--accent);text-decoration:none;font-weight:600;cursor:pointer}
    .error{background:rgba(255,100,100,.12);border:1px solid rgba(255,100,100,.4);
      color:#ff9b9b;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:16px}
    .hidden{display:none}
  </style>
</head>
<body>
  <div class="bg-fallback"></div>
  <video id="bgvideo" autoplay muted loop playsinline onerror="this.style.display='none'">
    <source src="{{ url_for('static', filename='video/login-bg.mp4') }}" type="video/mp4">
  </video>
  <div class="overlay"></div>
  <div class="grid-lines"></div>

  <div class="card">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#06080a" stroke-width="2.5">
          <circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="#06080a"/>
        </svg>
      </div>
      <div class="brand-name">Study<span>Flow</span></div>
    </div>
    <div class="subtitle" id="subtitle">Inteligência de conteúdo com IA</div>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <div class="social">
      <a href="/auth/google">
        <svg viewBox="0 0 24 24"><path fill="#fff" d="M21.35 11.1H12v3.2h5.35c-.23 1.4-1.62 4.1-5.35 4.1-3.22 0-5.85-2.66-5.85-5.95S8.78 6.5 12 6.5c1.83 0 3.06.78 3.76 1.45l2.56-2.47C16.7 3.9 14.6 3 12 3 6.98 3 3 6.98 3 12s3.98 9 9 9c5.2 0 8.64-3.65 8.64-8.8 0-.6-.07-1.05-.16-1.5z"/></svg>
        Continuar com Google
      </a>
      <a href="/auth/linkedin">
        <svg viewBox="0 0 24 24"><path fill="#fff" d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14zM8.34 18.34v-8H5.67v8h2.67zM7 9.16a1.55 1.55 0 1 0 0-3.1 1.55 1.55 0 0 0 0 3.1zm11.34 9.18v-4.39c0-2.35-1.25-3.44-2.92-3.44-1.35 0-1.95.74-2.29 1.26v-1.08h-2.67v8h2.67v-4.47c0-1.18.83-1.4 1.18-1.4.69 0 1.36.42 1.36 1.65v4.22h2.67z"/></svg>
        Continuar com LinkedIn
      </a>
      <a href="/auth/instagram">
        <svg viewBox="0 0 24 24"><path fill="#fff" d="M12 2.16c3.2 0 3.58.01 4.85.07 3.25.15 4.77 1.69 4.92 4.92.06 1.27.07 1.65.07 4.85s-.01 3.58-.07 4.85c-.15 3.23-1.66 4.77-4.92 4.92-1.27.06-1.65.07-4.85.07s-3.58-.01-4.85-.07c-3.26-.15-4.77-1.7-4.92-4.92-.06-1.27-.07-1.65-.07-4.85s.01-3.58.07-4.85C2.38 3.92 3.9 2.38 7.15 2.23 8.42 2.17 8.8 2.16 12 2.16zM12 7.4a4.6 4.6 0 1 0 0 9.2 4.6 4.6 0 0 0 0-9.2zm0 7.58a2.98 2.98 0 1 1 0-5.96 2.98 2.98 0 0 1 0 5.96zm4.8-7.76a1.08 1.08 0 1 0 0 2.16 1.08 1.08 0 0 0 0-2.16z"/></svg>
        Continuar com Instagram
      </a>
    </div>

    <div class="divider">ou com e-mail</div>

    <form method="POST" action="/login" id="loginForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="li-user">E-mail</label>
        <input id="li-user" type="text" name="username" placeholder="voce@email.com" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="li-pass">Senha</label>
        <input id="li-pass" type="password" name="password" placeholder="Sua senha" autocomplete="current-password" required>
      </div>
      <button class="btn-primary" type="submit">Entrar</button>
    </form>

    <form method="POST" action="/signup" id="signupForm" class="hidden">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="field">
        <label for="su-name">Nome</label>
        <input id="su-name" type="text" name="name" placeholder="Como devemos te chamar">
      </div>
      <div class="field">
        <label for="su-email">E-mail</label>
        <input id="su-email" type="email" name="email" placeholder="voce@email.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="su-pass">Senha</label>
        <input id="su-pass" type="password" name="password" placeholder="Mínimo 6 caracteres" minlength="6" autocomplete="new-password" required>
      </div>
      <button class="btn-primary" type="submit">Criar conta</button>
    </form>

    <div class="toggle" id="toggle">
      Não tem conta? <a onclick="toMode('signup')">Criar agora</a>
    </div>
  </div>

  <script>
    const login = document.getElementById('loginForm');
    const signup = document.getElementById('signupForm');
    const toggle = document.getElementById('toggle');
    const subtitle = document.getElementById('subtitle');
    function toMode(m){
      const isSignup = m === 'signup';
      login.classList.toggle('hidden', isSignup);
      signup.classList.toggle('hidden', !isSignup);
      subtitle.textContent = isSignup ? 'Crie sua conta em segundos' : 'Inteligência de conteúdo com IA';
      toggle.innerHTML = isSignup
        ? 'Já tem conta? <a onclick="toMode(\'login\')">Entrar</a>'
        : 'Não tem conta? <a onclick="toMode(\'signup\')">Criar agora</a>';
    }
    {% if mode == 'signup' %}toMode('signup');{% endif %}
  </script>
</body>
</html>
