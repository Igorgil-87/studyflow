<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyFlow · Verificação</title>
  <style>
    :root{--bg:#050507;--card:rgba(18,19,24,0.62);--line:rgba(255,255,255,0.10);
      --accent:#d4ff4f;--text:#f4f3f0;--muted:#9b9a96;--input:rgba(255,255,255,0.06);}
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
      display:flex;align-items:center;justify-content:center;overflow:hidden}
    #bgvideo{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;
      z-index:-2;filter:brightness(0.45) saturate(1.1)}
    .bg-fallback{position:fixed;inset:0;z-index:-3;
      background:radial-gradient(1200px 600px at 70% 20%, rgba(50,90,120,0.35), transparent 60%),
        radial-gradient(900px 500px at 20% 80%, rgba(120,90,180,0.25), transparent 60%),#050507}
    .overlay{position:fixed;inset:0;z-index:-1;
      background:radial-gradient(circle at 50% 40%, rgba(5,5,7,0.25), rgba(5,5,7,0.88))}
    .card{width:min(92vw,400px);padding:38px 34px;background:var(--card);
      border:1px solid var(--line);border-radius:24px;
      backdrop-filter:blur(24px) saturate(1.2);-webkit-backdrop-filter:blur(24px) saturate(1.2);
      box-shadow:0 30px 80px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
      text-align:center;animation:rise .6s cubic-bezier(.2,.8,.2,1)}
    @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
    .ic{width:54px;height:54px;border-radius:14px;background:rgba(212,255,79,0.12);
      border:1px solid rgba(212,255,79,0.4);display:flex;align-items:center;
      justify-content:center;margin:0 auto 16px}
    .ic svg{width:26px;height:26px;stroke:var(--accent)}
    h1{font-size:20px;margin-bottom:8px}
    .sub{color:var(--muted);font-size:13.5px;line-height:1.5;margin-bottom:24px}
    .sub b{color:var(--text)}
    input{width:100%;padding:16px;border-radius:12px;background:var(--input);
      border:1px solid var(--line);color:var(--text);font-size:26px;text-align:center;
      letter-spacing:10px;outline:none;font-weight:700}
    input:focus{border-color:var(--accent)}
    input::placeholder{color:rgba(155,154,150,0.5);letter-spacing:10px}
    .btn{width:100%;padding:14px;margin-top:16px;border:none;border-radius:12px;
      background:var(--accent);color:#06080a;font-size:15px;font-weight:700;cursor:pointer}
    .btn:hover{filter:brightness(1.05)}
    .links{margin-top:18px;font-size:13px;color:var(--muted);display:flex;
      justify-content:space-between}
    .links a,.links button{color:var(--accent);text-decoration:none;font-weight:600;
      background:none;border:none;cursor:pointer;font-size:13px;font-family:inherit}
    .error{background:rgba(255,100,100,.12);border:1px solid rgba(255,100,100,.4);
      color:#ff9b9b;padding:10px 14px;border-radius:10px;font-size:13px;margin-bottom:16px}
  </style>
</head>
<body>
  <div class="bg-fallback"></div>
  <video id="bgvideo" autoplay muted loop playsinline onerror="this.style.display='none'">
    <source src="{{ url_for('static', filename='video/login-bg.mp4') }}" type="video/mp4">
  </video>
  <div class="overlay"></div>

  <div class="card">
    <div class="ic">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2">
        <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>
    <h1>Verifique seu e-mail</h1>
    <div class="sub">Enviamos um código de 6 dígitos para<br><b>{{ email }}</b></div>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <form method="POST" action="/mfa">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="text" name="code" inputmode="numeric" pattern="[0-9]*" maxlength="6"
             placeholder="••••••" autocomplete="one-time-code" autofocus required>
      <button class="btn" type="submit">Verificar e entrar</button>
    </form>

    <div class="links">
      <a href="/login">← Voltar</a>
      <form method="POST" action="/mfa/resend" style="display:inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">Reenviar código</button>
      </form>
    </div>
  </div>
</body>
</html>
